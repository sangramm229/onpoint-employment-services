<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="favPin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092B46" />
      <stop offset="100%" stop-color="#06466B" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#F5C52E" />
    </linearGradient>
